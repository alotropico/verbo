<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 1288" role="img" aria-labelledby="title desc">
  <title id="title">How a Verbo turn moves</title>
  <desc id="desc">Typed text and speech meet in one queue. One Ollama turn runs. A voice session speaks the reply through Piper and pauses the microphone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="736" height="1288" fill="#fafaf9"/>

  <text x="174" y="28" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Typed</text>
  <text x="562" y="28" text-anchor="middle" fill="#1f6b4a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Speech</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="24" y="44" width="300" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="174" y="68" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Typed composer</text>
    <text x="174" y="88" text-anchor="middle" fill="#57534e" font-size="12">Enter sends</text>

    <polygon points="174,122 274,168 174,214 74,168" fill="#ffffff" stroke="#44403c" stroke-width="1.5"/>
    <text x="174" y="164" text-anchor="middle" fill="#1c1917" font-size="13" font-weight="600">Leading slash?</text>
    <text x="174" y="182" text-anchor="middle" fill="#57534e" font-size="11">always local</text>

    <rect x="24" y="236" width="200" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="124" y="260" text-anchor="middle" fill="#1c1917" font-size="14" font-weight="600">Local command</text>
    <text x="124" y="278" text-anchor="middle" fill="#57534e" font-size="11">/remember, /files, /action</text>

    <rect x="412" y="44" width="300" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="562" y="68" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Microphone</text>
    <text x="562" y="88" text-anchor="middle" fill="#57534e" font-size="12">Stop releases the mic</text>

    <rect x="412" y="128" width="300" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="562" y="152" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Capture and silence clock</text>
    <text x="562" y="172" text-anchor="middle" fill="#57534e" font-size="12">Renderer</text>

    <rect x="412" y="212" width="300" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="562" y="236" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Main voice client</text>
    <text x="562" y="256" text-anchor="middle" fill="#57534e" font-size="12">POST /v1/transcribe</text>

    <rect x="412" y="296" width="300" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="562" y="320" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">STT faster-whisper</text>
    <text x="562" y="340" text-anchor="middle" fill="#57534e" font-size="12">English or Spanish</text>

    <polygon points="562,374 682,428 562,482 442,428" fill="#ffffff" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="562" y="424" text-anchor="middle" fill="#1c1917" font-size="13" font-weight="600">clear chat</text>
    <text x="562" y="442" text-anchor="middle" fill="#57534e" font-size="11">or empty chat?</text>

    <rect x="412" y="508" width="144" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="484" y="532" text-anchor="middle" fill="#1c1917" font-size="13" font-weight="600">Blank chat</text>
    <text x="484" y="550" text-anchor="middle" fill="#57534e" font-size="11">history stays</text>

    <rect x="568" y="508" width="144" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="640" y="532" text-anchor="middle" fill="#1c1917" font-size="13" font-weight="600">Voice draft</text>
    <text x="640" y="550" text-anchor="middle" fill="#57534e" font-size="11">one per thread</text>
  </g>

  <g font-family="Segoe UI, sans-serif" fill="#57534e" font-size="11">
    <text x="96" y="228">slash</text>
    <text x="258" y="188">chat text</text>
    <text x="456" y="498">alone</text>
    <text x="628" y="498">transcript</text>
    <text x="500" y="592">quiet or Send</text>
    <text x="368" y="916" text-anchor="middle">tools</text>
    <text x="382" y="1056">voice session on</text>
  </g>

  <g font-family="Segoe UI, sans-serif">
    <rect x="24" y="612" width="688" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="368" y="636" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">FIFO queue</text>
    <text x="368" y="656" text-anchor="middle" fill="#57534e" font-size="12">One turn at a time. Speech waits behind earlier text.</text>

    <rect x="188" y="728" width="360" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="368" y="752" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">One active turn</text>
    <text x="368" y="772" text-anchor="middle" fill="#57534e" font-size="12">Electron main</text>

    <rect x="188" y="812" width="360" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="368" y="836" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Context builder</text>
    <text x="368" y="856" text-anchor="middle" fill="#57534e" font-size="12">Frozen for this turn</text>

    <rect x="24" y="896" width="300" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="174" y="920" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Ollama</text>
    <text x="174" y="940" text-anchor="middle" fill="#57534e" font-size="12">stream</text>

    <rect x="412" y="896" width="300" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="562" y="920" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Action registry</text>
    <text x="562" y="940" text-anchor="middle" fill="#57534e" font-size="12">list, describe, invoke</text>

    <rect x="188" y="980" width="360" height="58" rx="8" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
    <text x="368" y="1004" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Transcript in SQLite</text>
    <text x="368" y="1024" text-anchor="middle" fill="#57534e" font-size="12">Full reply text stays</text>

    <rect x="188" y="1064" width="360" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="368" y="1088" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Main voice client</text>
    <text x="368" y="1108" text-anchor="middle" fill="#57534e" font-size="12">POST /v1/synthesize</text>

    <rect x="188" y="1148" width="360" height="58" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="368" y="1172" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">TTS Piper</text>
    <text x="368" y="1192" text-anchor="middle" fill="#57534e" font-size="12">wav, default LJ Speech</text>

    <rect x="188" y="1232" width="360" height="40" rx="8" fill="#e7f3ec" stroke="#1f6b4a" stroke-width="1.5"/>
    <text x="368" y="1257" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="600">Speaker pauses the microphone</text>
  </g>

  <g fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 174 102 V 118"/>
    <path d="M 124 214 V 232"/>
    <path d="M 250 196 H 310 V 608"/>
    <path d="M 562 102 V 124"/>
    <path d="M 562 186 V 208"/>
    <path d="M 562 270 V 292"/>
    <path d="M 562 354 V 370"/>
    <path d="M 500 478 V 504"/>
    <path d="M 624 478 V 504"/>
    <path d="M 640 566 V 608"/>
    <path d="M 368 670 V 724"/>
    <path d="M 368 786 V 808"/>
    <path d="M 368 870 V 882 H 174 V 892"/>
    <path d="M 328 925 H 408"/>
    <path d="M 174 954 V 966 H 368 V 976"/>
    <path d="M 368 1038 V 1060"/>
    <path d="M 368 1122 V 1144"/>
    <path d="M 368 1206 V 1228"/>
  </g>
</svg>
